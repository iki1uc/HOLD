<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>iki1uc · HOLD Constellation</title>

<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  padding:40px;
}
h1 {
  color:#0f0;
  font-size:32px;
}
.block {
  margin:20px 0;
  padding:20px;
  border:1px solid #0f0;
}
pre {
  background:#010;
  padding:20px;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<h1>HOLD · Constellation</h1>

<div class="block" id="output">OUTPUT</div>
<div class="block" id="split">SPLIT</div>
<div class="block" id="geo">GEO</div>

<script type="module">
import { HOLD_constellation_output } from "./HOLD.output.js";
import { HOLD_constellation_split } from "./HOLD.split.js";
import { HOLD_constellation_geo } from "./HOLD.geo.js";

// OUTPUT
const out = HOLD_constellation_output.dump();
document.getElementById("output").innerHTML =
  "<pre>" + JSON.stringify(out, null, 4) + "</pre>";

// SPLIT
const splitData = {
  state: HOLD_constellation_split.state(),
  freeze: HOLD_constellation_split.freeze(),
  pipe: HOLD_constellation_split.pipe()
};
document.getElementById("split").innerHTML =
  "<pre>" + JSON.stringify(splitData, null, 4) + "</pre>";

// GEO
const geoMap = HOLD_constellation_geo.map();
document.getElementById("geo").innerHTML =
  "<pre>" + JSON.stringify(geoMap, null, 4) + "</pre>;
</script>

</body>
</html>
